<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151b22"><link rel="manifest" href="manifest.json"><title>SLOW REP</title><style> *{box-sizing:border-box}body{background:#151b22;color:#f2f5f4;font:16px system-ui;margin:auto;max-width:480px;padding:24px}h1{letter-spacing:5px;margin-bottom:0}small,label{color:#b3c0c4} .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:24px 0}label{display:block}input,select{width:100%;background:#242e36;color:white;border:1px solid #46545b;border-radius:10px;padding:10px;font-size:20px}#dial{border:8px solid #62c9a2;border-radius:50%;width:210px;height:210px;margin:20px auto;display:grid;place-content:center;text-align:center}#num{font-size:80px;font-weight:bold;line-height:1.1}#phase,#count{text-align:center;font-size:20px}button{border:0;border-radius:30px;padding:16px;font-size:18px;font-weight:bold;background:#62c9a2;color:#10231c;flex:1}button.secondary{background:#303c45;color:white}.buttons{display:flex;gap:10px;margin:24px 0}progress{width:100%;accent-color:#62c9a2}input[type=range]{padding:0} </style><h1>SLOW REP</h1><small>筋トレ専用テンポタイマー</small><div class="grid" id="settings"><label>下降（秒）<input id="down" type="number" min="1" max="30" value="3"></label><label>上昇（秒）<input id="up" type="number" min="1" max="30" value="1"></label><label>回数<input id="reps" type="number" min="1" max="100" value="10"></label><label>セット数<input id="sets" type="number" min="1" max="20" value="2"></label><label>休憩（秒）<input id="rest" type="number" min="0" max="600" value="120"></label><label>音量<input id="volume" type="range" min="0" max="100" value="80"></label></div><div id="phase">準備完了</div><div id="dial"><div id="num">3</div><small>SECONDS</small></div><div id="count">0 / 10 回 · 1 / 2 セット</div><progress id="progress" value="0" max="20"></progress><div class="buttons"><button id="start">START</button><button class="secondary" id="reset">RESET</button></div><small>低音：下降 ／ 高音：上昇 ／ 休憩・終了：長音<br>使用中は画面を開いたままにしてください。</small><script>
const $=id=>document.getElementById(id),keys=['down','up','reps','sets','rest','volume'];let cfg={},ctx,lock,timer=null,phase='ready',rep=0,set=1,end=0,running=false,paused=false,remaining=0,last=-1,serial=0;
for(const k of keys){try{const v=localStorage.getItem(k);if(v!==null)$(k).value=v}catch{} $(k).addEventListener('change',()=>{read();if(!running&&!paused)reset()})}
function read(){for(const k of keys){const e=$(k);cfg[k]=Math.max(+e.min,Math.min(+e.max,Number.isFinite(e.valueAsNumber)?e.valueAsNumber:+e.defaultValue));e.value=cfg[k];try{localStorage.setItem(k,cfg[k])}catch{}}}
function beep(f,d=.15){if(!ctx||!+$('volume').value)return;try{let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.setValueAtTime(0.65*+$('volume').value/100,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}catch{}}
async function wake(){const s=serial;try{const l=await navigator.wakeLock.request('screen');if(running&&s===serial)lock=l;else await l.release()}catch{}}function release(){if(lock){lock.release().catch(()=>{});lock=null}}
const labels={ready:'準備',down:'ゆっくり下ろす',up:'押し上げる',rest:'セット間休憩',done:'全セット完了！'};
function show(n){$('phase').textContent=labels[phase];$('num').textContent=n;$('count').textContent=`${rep} / ${cfg.reps} 回 · ${set} / ${cfg.sets} セット`;$('progress').max=cfg.reps*cfg.sets;$('progress').value=(set-1)*cfg.reps+rep; $('dial').style.borderColor=phase==='up'?'#f5b96a':phase==='rest'?'#79a9df':'#62c9a2'}
function enter(p,seconds){phase=p;end=performance.now()+seconds*1000;last=seconds;show(seconds);beep(p==='up'?950:p==='rest'?650:440,p==='rest'?.5:.15)}
function tick(){let n=Math.max(0,Math.ceil((end-performance.now())/1000));if(n>0){if(n!==last){last=n;show(n);if(phase!=='rest'||n<=3)beep(phase==='up'?950:440)}return}if(phase==='ready'||phase==='rest'){if(phase==='rest'){set++;rep=0}enter('down',cfg.down)}else if(phase==='down')enter('up',cfg.up);else if(phase==='up'){rep++;if(rep<cfg.reps)enter('down',cfg.down);else if(set<cfg.sets)enter('rest',cfg.rest);else{phase='done';show('✓');beep(1200,.7);stop();$('start').textContent='START';enable(true)}}}
function enable(v){keys.filter(k=>k!=='volume').forEach(k=>$(k).disabled=!v)}function stop(){clearInterval(timer);timer=null;running=false;serial++;release()}
function reset(){stop();paused=false;read();rep=0;set=1;phase='ready';show(3);$('phase').textContent='準備完了';$('start').textContent='START';enable(true)}
$('start').onclick=()=>{if(running){remaining=Math.max(0,end-performance.now());stop();paused=true;$('start').textContent='再開';$('phase').textContent='一時停止';return}try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume()}catch{}running=true;serial++;wake();enable(false);if(paused){end=performance.now()+remaining;paused=false;show(Math.ceil(remaining/1000))}else{read();rep=0;set=1;enter('ready',3)}$('start').textContent='一時停止';timer=setInterval(tick,40)};$('reset').onclick=reset;document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&running)wake()});reset();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
